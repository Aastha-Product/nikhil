3333333333" y="173.5" text-anchor="middle" font-size="12.6" fill="#1b2a4a">Code on GitHub deploys to</text><text x="323.3333333333333" y="189" text-anchor="middle" font-size="12.6" fill="#1b2a4a">Vercel. Cron runs daily 3 AM</text><text x="323.3333333333333" y="204.5" text-anchor="middle" font-size="12.6" fill="#1b2a4a">UTC and re-researches any</text><text x="323.3333333333333" y="220" text-anchor="middle" font-size="12.6" fill="#1b2a4a">company older than 6 days</text><text x="323.3333333333333" y="235.5" text-anchor="middle" font-size="12.6" fill="#1b2a4a">(weekly).</text><rect x="223.33333333333331" y="272" width="200" height="92" rx="9" fill="#ffffff" stroke="#d14b4b" stroke-width="2.2"/><text x="323.3333333333333" y="299.25" text-anchor="middle" font-size="12.6" fill="#1b2a4a">Types a company in New</text><text x="323.3333333333333" y="314.75" text-anchor="middle" font-size="12.6" fill="#1b2a4a">research (auto-suggest fills</text><text x="323.3333333333333" y="330.25" text-anchor="middle" font-size="12.6" fill="#1b2a4a">the website) or clicks</text><text x="323.3333333333333" y="345.75" text-anchor="middle" font-size="12.6" fill="#1b2a4a">Refresh now on a report.</text><rect x="449.99999999999994" y="390" width="200" height="92" rx="9" fill="#d9eaf8" stroke="#3f8fcf" stroke-width="2.2"/><text x="550" y="409.5" text-anchor="middle" font-size="12.6" fill="#1b2a4a">Live public data: GitHub</text><text x="550" y="425" text-anchor="middle" font-size="12.6" fill="#1b2a4a">repos and languages, official</text><text x="550" y="440.5" text-anchor="middle" font-size="12.6" fill="#1b2a4a">job posts, engineering blogs</text><text x="550" y="456" text-anchor="middle" font-size="12.6" fill="#1b2a4a">and talks, the company</text><text x="550" y="471.5" text-anchor="middle" font-size="12.6" fill="#1b2a4a">website.</text><rect x="676.6666666666666" y="508" width="200" height="92" rx="9" fill="#d7f0dc" stroke="#2f9a4c" stroke-width="2.2"/><text x="776.6666666666666" y="535.25" text-anchor="middle" font-size="12.6" fill="#1b2a4a">Watchlist and FlowForge's</text><text x="776.6666666666666" y="550.75" text-anchor="middle" font-size="12.6" fill="#1b2a4a">target profile. Last good</text><text x="776.6666666666666" y="566.25" text-anchor="middle" font-size="12.6" fill="#1b2a4a">evidence is kept if a source</text><text x="776.6666666666666" y="581.75" text-anchor="middle" font-size="12.6" fill="#1b2a4a">fails this week.</text><rect x="903.3333333333334" y="626" width="200" height="92" rx="9" fill="#d4efe8" stroke="#1f9a85" stroke-width="2.2"/><text x="1003.3333333333334" y="645.5" text-anchor="middle" font-size="12.6" fill="#1b2a4a">Each finding gets a source</text><text x="1003.3333333333334" y="661" text-anchor="middle" font-size="12.6" fill="#1b2a4a">link, date, tier and</text><text x="1003.3333333333334" y="676.5" text-anchor="middle" font-size="12.6" fill="#1b2a4a">confidence. Gaps are listed.</text><text x="1003.3333333333334" y="692" text-anchor="middle" font-size="12.6" fill="#1b2a4a">Fit score 0–100 is set in</text><text x="1003.3333333333334" y="707.5" text-anchor="middle" font-size="12.6" fill="#1b2a4a">code.</text><rect x="1129.9999999999998" y="744" width="200" height="92" rx="9" fill="#e6dcfa" stroke="#7c5ccf" stroke-width="2.2"/><text x="1229.9999999999998" y="771.25" text-anchor="middle" font-size="12.6" fill="#1b2a4a">Writes a 2-paragraph summary</text><text x="1229.9999999999998" y="786.75" text-anchor="middle" font-size="12.6" fill="#1b2a4a">and one opening line using</text><text x="1229.9999999999998" y="802.25" text-anchor="middle" font-size="12.6" fill="#1b2a4a">only cited evidence. Never</text><text x="1229.9999999999998" y="817.75" text-anchor="middle" font-size="12.6" fill="#1b2a4a">sets the score.</text><rect x="903.3333333333334" y="862" width="200" height="92" rx="9" fill="#fbecc0" stroke="#d4a017" stroke-width="2.2"/><text x="1003.3333333333334" y="889.25" text-anchor="middle" font-size="12.6" fill="#1b2a4a">Checks the AI text: the line</text><text x="1003.3333333333334" y="904.75" text-anchor="middle" font-size="12.6" fill="#1b2a4a">must cite strong evidence;</text><text x="1003.3333333333334" y="920.25" text-anchor="middle" font-size="12.6" fill="#1b2a4a">unknown tools are rejected.</text><text x="1003.3333333333334" y="935.75" text-anchor="middle" font-size="12.6" fill="#1b2a4a">Saves report and run log.</text><rect x="1356.6666666666665" y="980" width="200" height="92" rx="9" fill="#ffffff" stroke="#d14b4b" stroke-width="2.2"/><text x="1456.6666666666665" y="1007.25" text-anchor="middle" font-size="12.6" fill="#1b2a4a">Watchlist ranked by fit.</text><text x="1456.6666666666665" y="1022.75" text-anchor="middle" font-size="12.6" fill="#1b2a4a">Report: opening line with its</text><text x="1456.6666666666665" y="1038.25" text-anchor="middle" font-size="12.6" fill="#1b2a4a">source, summary, evidence,</text><text x="1456.6666666666665" y="1053.75" text-anchor="middle" font-size="12.6" fill="#1b2a4a">score, history.</text><rect x="1356.6666666666665" y="1098" width="200" height="92" rx="9" fill="#ffffff" stroke="#d14b4b" stroke-width="2.2"/><text x="1456.6666666666665" y="1125.25" text-anchor="middle" font-size="12.6" fill="#1b2a4a">Nikhil copies the line, edits</text><text x="1456.6666666666665" y="1140.75" text-anchor="middle" font-size="12.6" fill="#1b2a4a">or rewrites it, logs</text><text x="1456.6666666666665" y="1156.25" text-anchor="middle" font-size="12.6" fill="#1b2a4a">outreach. Nothing is ever</text><text x="1456.6666666666665" y="1171.75" text-anchor="middle" font-size="12.6" fill="#1b2a4a">sent to the prospect.</text><text x="30" y="1239" font-size="14" fill="#4a5568">Dashed arrows follow one company from request to Nikhil's screen. Red boxes are what Nikhil does or sees.</text>
<text x="30" y="1260" font-size="14" fill="#4a5568">Facts come only from public sources, scores are computed in code, and Gemini Flash only writes text. If there's no engineering evidence, there's no score and the report explains why.</text>
